<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envios às Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#EEF1F3;
  --surface:#FFFFFF;
  --surface-2:#F7F9FA;
  --ink:#1A2530;
  --ink-soft:#55636E;
  --line:#D7DEE3;
  --accent:#1F5C8B;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4EEF5;
  --ok:#2F7D4F;
  --ok-soft:#E4F3E8;
  --warn:#B8720E;
  --warn-soft:#FBEEDA;
  --pending:#5B6570;
  --pending-soft:#E9ECEE;
  --danger:#B23A3A;
  --shadow: 0 1px 2px rgba(20,30,40,0.06), 0 6px 20px rgba(20,30,40,0.06);
  --radius: 8px;
  --font-display:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#171F26; --surface-2:#1E2830; --ink:#E6ECF1; --ink-soft:#93A1AC;
    --line:#2B3742; --accent:#6FB2E6; --accent-ink:#0B1A24; --accent-soft:#1C3140;
    --ok:#6FCB8E; --ok-soft:#1B3324; --warn:#E3A94A; --warn-soft:#3A2A12;
    --pending:#93A1AC; --pending-soft:#232C33; --danger:#E28080;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#171F26; --surface-2:#1E2830; --ink:#E6ECF1; --ink-soft:#93A1AC;
  --line:#2B3742; --accent:#6FB2E6; --accent-ink:#0B1A24; --accent-soft:#1C3140;
  --ok:#6FCB8E; --ok-soft:#1B3324; --warn:#E3A94A; --warn-soft:#3A2A12;
  --pending:#93A1AC; --pending-soft:#232C33; --danger:#E28080;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
#print-report{display:none;}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
button{font-family:var(--font-body);}
a{color:var(--accent);}
.boot-loading{padding:70px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--line);background:var(--surface);}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{font-size:28px;line-height:1;}
.brand-text h1{font-size:22px;font-weight:700;letter-spacing:0.2px;}
.brand-text .tagline{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}
.sync-badge{font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);}
.sync-badge.synced{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft);}
.sync-badge.local{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft);}
.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;min-width:76px;text-align:center;}
.stat-num{display:block;font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink);}
.stat-lbl{display:block;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}
.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:22px;padding:22px 28px 60px;max-width:1240px;margin:0 auto;align-items:start;}
@media (max-width: 880px){ .layout{grid-template-columns:1fr;} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.form-panel{position:sticky;top:22px;padding:18px 20px 20px;}
@media (max-width:880px){ .form-panel{position:static;} }
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.panel-head h2{font-size:17px;}
.ticket-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;color:var(--ink-soft);border:1px dashed var(--line);padding:3px 8px;border-radius:4px;}
form#envio-form{display:flex;flex-direction:column;gap:12px;}
form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;letter-spacing:0.02em;color:var(--ink-soft);text-transform:uppercase;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:420px){ .field-row{grid-template-columns:1fr;} }
@media (max-width:480px){
  .btn{padding:11px 16px;font-size:14px;}
  .btn-sm{padding:9px 14px;font-size:13px;}
  .photo-thumb{width:74px;height:74px;}
  .photo-thumb button{width:22px;height:22px;line-height:20px;font-size:14px;}
  .card-actions{gap:10px;}
}
input,textarea,select{font-family:var(--font-body);font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;text-transform:none;font-weight:400;width:100%;min-width:0;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
input[type="date"],input[type="text"]{font-variant-numeric:tabular-nums;}
textarea{resize:vertical;min-height:52px;}
.field-label-standalone{display:block;font-size:12.5px;font-weight:600;letter-spacing:0.02em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:5px;}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;}
.photo-actions label.btn{text-transform:none;display:inline-flex;align-items:center;width:auto;}
.file-input-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.photo-preview{display:flex;flex-wrap:wrap;gap:8px;}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;line-height:16px;padding:0;border-radius:50%;border:none;background:rgba(20,20,20,0.65);color:#fff;font-size:12px;cursor:pointer;}
.photo-hint{font-size:11.5px;color:var(--ink-soft);text-transform:none;font-weight:400;letter-spacing:0;}
.form-actions{display:flex;gap:10px;margin-top:4px;}
.btn{font-size:13.5px;font-weight:600;letter-spacing:0.01em;padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;}
.btn:hover{border-color:var(--ink-soft);}
.btn:disabled{opacity:0.6;cursor:default;}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-danger{color:var(--danger);}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.filters select{padding:6px 8px;font-size:13px;}
.envio-list{display:flex;flex-direction:column;gap:14px;padding:18px 20px 20px;}
.empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
.envio-card{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
.stripe{width:6px;flex-shrink:0;background:var(--pending);}
.envio-card.status-entregue .stripe{background:var(--ok);}
.envio-card.status-transito .stripe{background:var(--accent);}
.envio-card.status-programado .stripe{background:var(--warn);}
.card-body{flex:1;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-head h3{font-size:16.5px;font-weight:700;}
.pill{font-family:var(--font-mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.pill-entregue{background:var(--ok-soft);color:var(--ok);}
.pill-transito{background:var(--accent-soft);color:var(--accent);}
.pill-programado{background:var(--warn-soft);color:var(--warn);}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 16px;margin:0;}
.meta div{display:flex;flex-direction:column;gap:1px;}
.meta dt{font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-soft);}
.meta dd{margin:0;font-family:var(--font-mono);font-size:13.5px;font-variant-numeric:tabular-nums;}
.obs{margin:0;font-size:13.5px;color:var(--ink-soft);}
.thumb-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.thumb-strip img{width:52px;height:52px;object-fit:cover;border-radius:5px;border:1px solid var(--line);}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
.confirm-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,14,18,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--surface);border-radius:10px;padding:20px;max-width:480px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;}
.modal h3{font-size:16px;}
.modal textarea{font-family:var(--font-mono);font-size:13px;min-height:170px;white-space:pre-wrap;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:90vw;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:60;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast-warn{background:var(--warn);color:#1a1305;}
@media print{
  body > *:not(#print-report){display:none !important;}
  #print-report{display:block !important;background:#fff;color:#111;font-family:var(--font-body);padding:0;}
  .report-page{max-width:720px;margin:0 auto;padding:24px;}
  .report-head{margin-bottom:18px;}
  .report-head h1{font-size:20px;color:#111;font-family:var(--font-display);}
  .report-sub{color:#555;font-size:12px;margin:4px 0 0;}
  table.report-meta{width:100%;border-collapse:collapse;margin-bottom:20px;}
  table.report-meta th,table.report-meta td{border:1px solid #ccc;padding:6px 10px;text-align:left;font-size:12.5px;vertical-align:top;}
  table.report-meta th{width:180px;background:#f2f2f2;color:#333;}
  .report-photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .report-photos figure{margin:0;break-inside:avoid;}
  .report-photos img{width:100%;height:auto;border:1px solid #ccc;border-radius:4px;}
  .report-photos figcaption{font-size:11px;color:#555;margin-top:4px;}
  .no-photos{color:#777;font-style:italic;}
}
</style>
</head>
<body>
<div id="app"><div class="boot-loading">Carregando envios…</div></div>
<div id="print-report"></div>
<script>(function(){
'use strict';

var MAX_PHOTOS = 8;
var MAX_DIM = 1000;
var JPEG_QUALITY = 0.55;
var TOKEN_KEY = 'envios-obras-token';

function todayISO(){
  var d = new Date();
  var tz = d.getTimezoneOffset();
  var local = new Date(d.getTime() - tz*60000);
  return local.toISOString().slice(0,10);
}

function brDate(iso){
  if(!iso) return '';
  var p = iso.split('-');
  if(p.length!==3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function statusOf(envio){
  var today = todayISO();
  if(envio.dataChegada) return 'entregue';
  if(envio.dataEmbarque && envio.dataEmbarque > today) return 'programado';
  return 'transito';
}
function statusLabel(s){
  return s==='entregue' ? 'Entregue' : (s==='programado' ? 'Programado' : 'Em trânsito');
}

function getToken(){
  try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; }
}
function setToken(t){
  try{ localStorage.setItem(TOKEN_KEY, t); }catch(e){}
}

function apiFetch(path, options){
  options = options || {};
  var headers = Object.assign({}, options.headers || {});
  if(options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  var token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  return Promise.resolve().then(function(){
    return fetch(path, Object.assign({}, options, {headers: headers}));
  }).then(function(resp){
    if(resp.status === 401){
      var pw = window.prompt('Senha de acesso ao sistema de envios:');
      if(pw){
        setToken(pw);
        var headers2 = Object.assign({}, headers, {Authorization: 'Bearer ' + pw});
        return fetch(path, Object.assign({}, options, {headers: headers2}));
      }
    }
    return resp;
  });
}

function resizeImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, MAX_DIM / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,cw,ch);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      img.onerror = function(){ reject(new Error('img')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('reader')); };
    reader.readAsDataURL(file);
  });
}

function uploadPhoto(file){
  return resizeImage(file).then(function(dataUrl){
    var base64 = dataUrl.split(',')[1] || '';
    return apiFetch('/api/upload', {
      method: 'POST',
      body: JSON.stringify({ name: file.name, contentType: 'image/jpeg', dataBase64: base64 })
    });
  }).then(function(resp){
    if(!resp.ok) throw new Error('upload_failed');
    return resp.json();
  }).then(function(data){
    return { name: file.name, url: data.url };
  });
}

function buildWhatsAppMessage(e){
  var status = statusOf(e);
  var lines = [];
  lines.push('📦 *Relatório de Envio — ' + e.obra + '*');
  if(e.localRetirada) lines.push('📤 Retirada: ' + e.localRetirada);
  lines.push('🚚 Transportadora: ' + e.transportadora);
  if(e.numeroRomaneio) lines.push('📋 Romaneio: ' + e.numeroRomaneio);
  if(e.notaFiscal) lines.push('🧾 Nota fiscal: ' + e.notaFiscal);
  lines.push('📅 Embarque: ' + brDate(e.dataEmbarque));
  lines.push('📅 Chegada: ' + (e.dataChegada ? brDate(e.dataChegada) : 'ainda em trânsito'));
  lines.push('📍 Status: ' + statusLabel(status));
  if(e.observacoes) lines.push('📝 Obs.: ' + e.observacoes);
  if(e.fotos && e.fotos.length){
    lines.push('📷 Relatório fotográfico: ' + e.fotos.length + ' foto(s) em anexo.');
  }
  return lines.join('\n');
}

function buildReportHtml(e){
  var status = statusOf(e);
  var fotos = (e.fotos||[]).map(function(f, i){
    return '<figure><img src="'+f.url+'" alt="Foto '+(i+1)+'"><figcaption>Foto '+(i+1)+(f.name?' — '+escapeHtml(f.name):'')+'</figcaption></figure>';
  }).join('');
  var obsRow = e.observacoes ? ('<tr><th>Observações</th><td>'+escapeHtml(e.observacoes)+'</td></tr>') : '';
  return '' +
    '<div class="report-page">' +
      '<header class="report-head">' +
        '<h1>Relatório Fotográfico de Envio</h1>' +
        '<p class="report-sub">Gerado em ' + brDate(todayISO()) + '</p>' +
      '</header>' +
      '<table class="report-meta">' +
        '<tr><th>Obra</th><td>'+escapeHtml(e.obra)+'</td></tr>' +
        (e.localRetirada ? ('<tr><th>Local de retirada</th><td>'+escapeHtml(e.localRetirada)+'</td></tr>') : '') +
        '<tr><th>Transportadora</th><td>'+escapeHtml(e.transportadora)+'</td></tr>' +
        (e.numeroRomaneio ? ('<tr><th>Número do romaneio</th><td>'+escapeHtml(e.numeroRomaneio)+'</td></tr>') : '') +
        (e.notaFiscal ? ('<tr><th>Nota fiscal</th><td>'+escapeHtml(e.notaFiscal)+'</td></tr>') : '') +
        '<tr><th>Data de embarque</th><td>'+brDate(e.dataEmbarque)+'</td></tr>' +
        '<tr><th>Data de chegada</th><td>'+(e.dataChegada?brDate(e.dataChegada):'Em trânsito')+'</td></tr>' +
        '<tr><th>Status</th><td>'+statusLabel(status)+'</td></tr>' +
        obsRow +
      '</table>' +
      '<div class="report-photos">' + (fotos || '<p class="no-photos">Nenhuma foto anexada.</p>') + '</div>' +
    '</div>';
}

function toast(msg, isWarn){
  var t = document.createElement('div');
  t.className = 'toast' + (isWarn?' toast-warn':'');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, 3200);
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('Mensagem copiada!', false);
    }).catch(function(){
      toast('Não copiou automaticamente. Selecione o texto e copie manualmente.', true);
    });
  } else {
    toast('Selecione o texto no campo e copie manualmente.', true);
  }
}

var STATE = { envios: [] };
var connStatus = 'loading'; // 'loading' | 'online' | 'error'
var ui = { obraFiltro:'', statusFiltro:'', editingId:null, pendingPhotos:[], confirmDeleteId:null, whatsappId:null, uploading:false };

function handleRelatorio(id){
  var envio = STATE.envios.find(function(e){ return e.id===id; });
  if(!envio) return;
  var el = document.getElementById('print-report');
  el.innerHTML = buildReportHtml(envio);
  setTimeout(function(){ window.print(); }, 60);
}

function renderTopbar(){
  var total = STATE.envios.length;
  var counts = {entregue:0, transito:0, programado:0};
  STATE.envios.forEach(function(e){ counts[statusOf(e)]++; });
  var badgeClass = connStatus === 'online' ? 'synced' : (connStatus === 'error' ? 'local' : '');
  var badgeText = connStatus === 'online' ? 'Online' : (connStatus === 'error' ? 'Erro de conexão' : 'Conectando…');
  return '' +
  '<div class="topbar">' +
    '<div class="brand">' +
      '<span class="brand-mark" aria-hidden="true">📦</span>' +
      '<div class="brand-text">' +
        '<h1>Envios às Obras</h1>' +
        '<p class="tagline">Embarque · Transporte · Chegada · Relatório fotográfico</p>' +
      '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><span class="stat-num">'+total+'</span><span class="stat-lbl">Total</span></div>' +
      '<div class="stat"><span class="stat-num">'+counts.programado+'</span><span class="stat-lbl">Programado</span></div>' +
      '<div class="stat"><span class="stat-num">'+counts.transito+'</span><span class="stat-lbl">Em trânsito</span></div>' +
      '<div class="stat"><span class="stat-num">'+counts.entregue+'</span><span class="stat-lbl">Entregue</span></div>' +
      '<span class="sync-badge '+badgeClass+'">'+badgeText+'</span>' +
    '</div>' +
  '</div>';
}

function renderFormPanel(){
  var editing = ui.editingId ? STATE.envios.find(function(e){return e.id===ui.editingId;}) : null;
  var obra = editing ? editing.obra : '';
  var transportadora = editing ? editing.transportadora : '';
  var dataEmbarque = editing ? editing.dataEmbarque : todayISO();
  var dataChegada = editing ? (editing.dataChegada||'') : '';
  var observacoes = editing ? (editing.observacoes||'') : '';
  var numeroRomaneio = editing ? (editing.numeroRomaneio||'') : '';
  var notaFiscal = editing ? (editing.notaFiscal||'') : '';
  var localRetirada = editing ? (editing.localRetirada||'') : '';
  var obrasSet = {}; STATE.envios.forEach(function(e){ obrasSet[e.obra]=1; });
  var transpSet = {}; STATE.envios.forEach(function(e){ transpSet[e.transportadora]=1; });
  var localSet = {}; STATE.envios.forEach(function(e){ if(e.localRetirada) localSet[e.localRetirada]=1; });
  var obraOptions = Object.keys(obrasSet).map(function(o){return '<option value="'+escapeHtml(o)+'">';}).join('');
  var transpOptions = Object.keys(transpSet).map(function(t){return '<option value="'+escapeHtml(t)+'">';}).join('');
  var localOptions = Object.keys(localSet).map(function(l){return '<option value="'+escapeHtml(l)+'">';}).join('');
  var photos = ui.pendingPhotos.map(function(p,i){
    return '<div class="photo-thumb"><img src="'+p.url+'" alt=""><button type="button" data-action="remove-photo" data-index="'+i+'" aria-label="Remover foto">×</button></div>';
  }).join('');

  return '' +
  '<section class="panel form-panel" aria-label="Formulário de envio">' +
    '<div class="panel-head"><h2>'+(editing?'Editar envio':'Novo envio')+'</h2><span class="ticket-tag">MANIFESTO</span></div>' +
    '<form id="envio-form" novalidate data-editing-id="'+(editing?editing.id:'')+'">' +
      '<label>Obra<input type="text" name="obra" list="obras-list" required value="'+escapeHtml(obra)+'" placeholder="Ex.: Residencial Aurora"></label>' +
      '<datalist id="obras-list">'+obraOptions+'</datalist>' +
      '<label>Local de retirada<input type="text" name="localRetirada" list="locais-list" value="'+escapeHtml(localRetirada)+'" placeholder="Ex.: Depósito Central, Rua das Flores, 123"></label>' +
      '<datalist id="locais-list">'+localOptions+'</datalist>' +
      '<div class="field-row">' +
        '<label>Data de embarque<input type="date" name="dataEmbarque" required value="'+dataEmbarque+'"></label>' +
        '<label>Data de chegada<input type="date" name="dataChegada" value="'+dataChegada+'"></label>' +
      '</div>' +
      '<label>Empresa transportadora<input type="text" name="transportadora" list="transportadoras-list" required value="'+escapeHtml(transportadora)+'" placeholder="Ex.: Transportes Rio Claro"></label>' +
      '<datalist id="transportadoras-list">'+transpOptions+'</datalist>' +
      '<div class="field-row">' +
        '<label>Nº do romaneio<input type="text" name="numeroRomaneio" value="'+escapeHtml(numeroRomaneio)+'" placeholder="Ex.: 0001234"></label>' +
        '<label>Nº da nota fiscal<input type="text" name="notaFiscal" value="'+escapeHtml(notaFiscal)+'" placeholder="Ex.: NF-e 55123"></label>' +
      '</div>' +
      '<label>Observações<textarea name="observacoes" rows="2" placeholder="Itens, contato do motorista...">'+escapeHtml(observacoes)+'</textarea></label>' +
      '<div>' +
        '<span class="field-label-standalone">Fotos do relatório fotográfico</span>' +
        '<div class="photo-actions">' +
          '<label class="btn btn-sm" for="foto-capture">📷 Tirar foto</label>' +
          '<label class="btn btn-sm btn-ghost" for="foto-input">🖼️ Escolher da galeria</label>' +
        '</div>' +
        '<input type="file" id="foto-capture" accept="image/*" capture="environment" class="file-input-hidden">' +
        '<input type="file" id="foto-input" accept="image/*" multiple class="file-input-hidden">' +
        '<span class="photo-hint">'+(ui.uploading ? 'Enviando fotos…' : ('Até '+MAX_PHOTOS+' fotos. Compactadas automaticamente. "Tirar foto" abre a câmera do celular.'))+'</span>' +
      '</div>' +
      (photos ? '<div class="photo-preview">'+photos+'</div>' : '') +
      '<div class="form-actions">' +
        '<button type="submit" class="btn btn-primary">'+(editing?'Salvar alterações':'Registrar envio')+'</button>' +
        (editing ? '<button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar edição</button>' : '') +
      '</div>' +
    '</form>' +
  '</section>';
}

function renderCard(e){
  var status = statusOf(e);
  var fotos = e.fotos || [];
  var thumbs = fotos.slice(0,6).map(function(p){return '<img src="'+p.url+'" alt="">';}).join('');
  var moreCount = fotos.length - 6;
  var thumbStrip = fotos.length ? ('<div class="thumb-strip">'+thumbs+(moreCount>0?'<span class="obs">+'+moreCount+'</span>':'')+'</div>') : '';
  var confirm = ui.confirmDeleteId===e.id ? ('<div class="confirm-row">Excluir este envio permanentemente? <button type="button" class="btn btn-sm btn-danger" data-action="confirmar-excluir" data-id="'+e.id+'">Sim, excluir</button><button type="button" class="btn btn-sm btn-ghost" data-action="cancelar-excluir">Cancelar</button></div>') : '';
  return '' +
  '<article class="envio-card status-'+status+'">' +
    '<div class="stripe"></div>' +
    '<div class="card-body">' +
      '<div class="card-head"><h3>'+escapeHtml(e.obra)+'</h3><span class="pill pill-'+status+'">'+statusLabel(status)+'</span></div>' +
      '<dl class="meta">' +
        '<div><dt>Retirada</dt><dd>'+(e.localRetirada?escapeHtml(e.localRetirada):'—')+'</dd></div>' +
        '<div><dt>Embarque</dt><dd>'+brDate(e.dataEmbarque)+'</dd></div>' +
        '<div><dt>Transportadora</dt><dd>'+escapeHtml(e.transportadora)+'</dd></div>' +
        '<div><dt>Chegada</dt><dd>'+(e.dataChegada?brDate(e.dataChegada):'—')+'</dd></div>' +
        '<div><dt>Romaneio</dt><dd>'+(e.numeroRomaneio?escapeHtml(e.numeroRomaneio):'—')+'</dd></div>' +
        '<div><dt>Nota fiscal</dt><dd>'+(e.notaFiscal?escapeHtml(e.notaFiscal):'—')+'</dd></div>' +
      '</dl>' +
      (e.observacoes ? ('<p class="obs">'+escapeHtml(e.observacoes)+'</p>') : '') +
      thumbStrip +
      '<div class="card-actions">' +
        (status!=='entregue' ? ('<button type="button" class="btn btn-sm" data-action="marcar-entregue" data-id="'+e.id+'">Marcar como entregue</button>') : '') +
        '<button type="button" class="btn btn-sm" data-action="relatorio" data-id="'+e.id+'">Relatório fotográfico</button>' +
        '<button type="button" class="btn btn-sm" data-action="whatsapp" data-id="'+e.id+'">Mensagem WhatsApp</button>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-action="editar" data-id="'+e.id+'">Editar</button>' +
        '<button type="button" class="btn btn-sm btn-danger" data-action="excluir" data-id="'+e.id+'">Excluir</button>' +
      '</div>' +
      confirm +
    '</div>' +
  '</article>';
}

function renderListPanel(){
  var obras = {}; STATE.envios.forEach(function(e){obras[e.obra]=1;});
  var obraOpts = Object.keys(obras).sort().map(function(o){
    return '<option value="'+escapeHtml(o)+'"'+(ui.obraFiltro===o?' selected':'')+'>'+escapeHtml(o)+'</option>';
  }).join('');
  var statuses = [['','Todos'],['programado','Programado'],['transito','Em trânsito'],['entregue','Entregue']];
  var statusOpts = statuses.map(function(s){
    return '<option value="'+s[0]+'"'+(ui.statusFiltro===s[0]?' selected':'')+'>'+s[1]+'</option>';
  }).join('');

  var list = STATE.envios.slice().sort(function(a,b){ return (b.criadoEm||'').localeCompare(a.criadoEm||''); });
  list = list.filter(function(e){
    if(ui.obraFiltro && e.obra!==ui.obraFiltro) return false;
    if(ui.statusFiltro && statusOf(e)!==ui.statusFiltro) return false;
    return true;
  });

  var cardsHtml = list.length ? list.map(renderCard).join('') : '<div class="empty-state">Nenhum envio registrado ainda. Use o formulário ao lado para começar.</div>';

  return '' +
  '<section class="panel list-panel" aria-label="Histórico de envios">' +
    '<div class="panel-head">' +
      '<h2>Histórico de envios</h2>' +
      '<div class="filters">' +
        '<select id="filtro-obra"><option value="">Todas as obras</option>'+obraOpts+'</select>' +
        '<select id="filtro-status">'+statusOpts+'</select>' +
      '</div>' +
    '</div>' +
    '<div class="envio-list">'+cardsHtml+'</div>' +
  '</section>';
}

function renderModal(){
  if(!ui.whatsappId) return '';
  var e = STATE.envios.find(function(x){return x.id===ui.whatsappId;});
  if(!e) return '';
  var msg = buildWhatsAppMessage(e);
  return '' +
  '<div class="modal-overlay">' +
    '<div class="modal" role="dialog" aria-label="Mensagem para o grupo da obra">' +
      '<h3>Mensagem para o grupo — '+escapeHtml(e.obra)+'</h3>' +
      '<textarea id="whatsapp-text" readonly>'+escapeHtml(msg)+'</textarea>' +
      '<p class="photo-hint">Copie e cole no grupo do WhatsApp da obra. Anexe o relatório fotográfico (PDF) junto com a mensagem.</p>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-ghost" data-action="close-modal">Fechar</button>' +
        '<button type="button" class="btn btn-primary" data-action="copy-whatsapp" data-id="'+e.id+'">Copiar mensagem</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function render(){
  var app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = renderTopbar() + '<div class="layout">' + renderFormPanel() + renderListPanel() + '</div>' + renderModal();
}

function loadState(){
  connStatus = 'loading';
  render();
  return apiFetch('/api/envios').then(function(resp){
    if(!resp.ok) throw new Error('load_failed:' + resp.status);
    return resp.json();
  }).then(function(data){
    STATE.envios = data.envios || [];
    connStatus = 'online';
    render();
  }).catch(function(err){
    connStatus = 'error';
    render();
    toast('Não foi possível carregar os envios. Verifique a conexão e recarregue a página.', true);
  });
}

function bindEvents(){
  var app = document.getElementById('app');

  app.addEventListener('submit', function(e){
    if(!e.target || e.target.id !== 'envio-form') return;
    e.preventDefault();
    var fd = new FormData(e.target);
    var payload = {
      obra: (fd.get('obra')||'').toString().trim(),
      localRetirada: (fd.get('localRetirada')||'').toString().trim(),
      transportadora: (fd.get('transportadora')||'').toString().trim(),
      dataEmbarque: (fd.get('dataEmbarque')||'').toString(),
      dataChegada: (fd.get('dataChegada')||'').toString(),
      numeroRomaneio: (fd.get('numeroRomaneio')||'').toString().trim(),
      notaFiscal: (fd.get('notaFiscal')||'').toString().trim(),
      observacoes: (fd.get('observacoes')||'').toString().trim(),
      fotos: ui.pendingPhotos.slice()
    };
    if(!payload.obra || !payload.transportadora || !payload.dataEmbarque){
      toast('Preencha obra, transportadora e data de embarque.', true);
      return;
    }
    var editingId = e.target.dataset.editingId;
    var submitBtn = e.target.querySelector('button[type="submit"]');
    if(submitBtn) submitBtn.disabled = true;

    var req = editingId
      ? apiFetch('/api/envios/update', {method:'POST', body: JSON.stringify(Object.assign({id:editingId}, payload))})
      : apiFetch('/api/envios', {method:'POST', body: JSON.stringify(payload)});

    req.then(function(resp){
      if(!resp.ok) throw new Error('save_failed:' + resp.status);
      return resp.json();
    }).then(function(data){
      if(editingId){
        STATE.envios = STATE.envios.map(function(ev){ return ev.id===editingId ? data.envio : ev; });
      } else {
        STATE.envios.unshift(data.envio);
      }
      ui.editingId = null;
      ui.pendingPhotos = [];
      render();
      toast(editingId ? 'Envio atualizado.' : 'Envio registrado.', false);
    }).catch(function(){
      toast('Não foi possível salvar. Tente novamente.', true);
      if(submitBtn) submitBtn.disabled = false;
    });
  });

  app.addEventListener('change', function(e){
    var t = e.target;
    if(t.id === 'foto-input' || t.id === 'foto-capture'){
      var files = Array.prototype.slice.call(t.files || []);
      var room = MAX_PHOTOS - ui.pendingPhotos.length;
      var toProcess = files.slice(0, Math.max(0, room));
      if(files.length && !toProcess.length){
        toast('Limite de '+MAX_PHOTOS+' fotos por envio.', true);
        return;
      }
      ui.uploading = true;
      render();
      Promise.all(toProcess.map(function(f){
        return uploadPhoto(f).catch(function(){ return null; });
      })).then(function(results){
        ui.uploading = false;
        var okCount = 0;
        results.forEach(function(r){ if(r){ ui.pendingPhotos.push(r); okCount++; } });
        if(okCount < toProcess.length) toast('Algumas fotos não foram enviadas. Tente novamente.', true);
        render();
      });
      return;
    }
    if(t.id === 'filtro-obra'){ ui.obraFiltro = t.value; render(); return; }
    if(t.id === 'filtro-status'){ ui.statusFiltro = t.value; render(); return; }
  });

  app.addEventListener('click', function(e){
    if(e.target.classList && e.target.classList.contains('modal-overlay')){
      ui.whatsappId = null; render(); return;
    }
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if(!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;

    if(action==='cancel-edit'){
      ui.editingId=null; ui.pendingPhotos=[]; render();
    } else if(action==='remove-photo'){
      var idx = parseInt(el.dataset.index,10);
      ui.pendingPhotos.splice(idx,1); render();
    } else if(action==='marcar-entregue'){
      apiFetch('/api/envios/update', {method:'POST', body: JSON.stringify({id:id, dataChegada: todayISO()})})
        .then(function(resp){ if(!resp.ok) throw new Error('update_failed'); return resp.json(); })
        .then(function(data){
          STATE.envios = STATE.envios.map(function(ev){ return ev.id===id ? data.envio : ev; });
          render();
        })
        .catch(function(){ toast('Não foi possível atualizar.', true); });
    } else if(action==='relatorio'){
      handleRelatorio(id);
    } else if(action==='whatsapp'){
      ui.whatsappId = id; render();
    } else if(action==='close-modal'){
      ui.whatsappId = null; render();
    } else if(action==='copy-whatsapp'){
      var envio = STATE.envios.find(function(x){return x.id===id;});
      if(envio) copyText(buildWhatsAppMessage(envio));
    } else if(action==='editar'){
      ui.editingId = id;
      var ev2 = STATE.envios.find(function(x){return x.id===id;});
      ui.pendingPhotos = ev2 ? (ev2.fotos||[]).slice() : [];
      ui.confirmDeleteId = null;
      render();
      var panel = document.querySelector('.form-panel');
      if(panel && panel.scrollIntoView) panel.scrollIntoView({behavior:'smooth', block:'start'});
    } else if(action==='excluir'){
      ui.confirmDeleteId = id; render();
    } else if(action==='cancelar-excluir'){
      ui.confirmDeleteId = null; render();
    } else if(action==='confirmar-excluir'){
      apiFetch('/api/envios/delete', {method:'POST', body: JSON.stringify({id:id})})
        .then(function(resp){ if(!resp.ok) throw new Error('delete_failed'); })
        .then(function(){
          STATE.envios = STATE.envios.filter(function(x){return x.id!==id;});
          ui.confirmDeleteId = null;
          render();
          toast('Envio excluído.', false);
        })
        .catch(function(){ toast('Não foi possível excluir.', true); });
    }
  });
}

bindEvents();
loadState();

})();</script>
</body>
</html>
